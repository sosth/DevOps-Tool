<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #deploymentsList {
            margin-top: 20px;
        }
        .deployment-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create New Deployment</h1>
        <form id="deploymentForm">
            <label for="deploymentName">Deployment Name:</label>
            <input type="text" id="deploymentName" name="deploymentName" required>
            
            <label for="sourceOrg">Source Organization:</label>
            <select id="sourceOrg" name="sourceOrg" required>
                <option value="">Select Source Org</option>
                <!-- Options will be populated dynamically -->
            </select>
            
            <label for="targetOrg">Target Organization:</label>
            <select id="targetOrg" name="targetOrg" required>
                <option value="">Select Target Org</option>
                <!-- Options will be populated dynamically -->
            </select>
            
            <button type="submit">Create Deployment</button>
        </form>

        <h2>Existing Deployments</h2>
        <div id="deploymentsList">
            <!-- Deployments will be listed here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch and populate organization options
            fetch('/connected-orgs')
                .then(response => response.json())
                .then(orgs => {
                    const sourceOrgSelect = document.getElementById('sourceOrg');
                    const targetOrgSelect = document.getElementById('targetOrg');
                    orgs.forEach(org => {
                        const option = new Option(org.name, org.org_id);
                        sourceOrgSelect.add(option.cloneNode(true));
                        targetOrgSelect.add(option);
                    });
                });

            // Handle form submission
            document.getElementById('deploymentForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                const deploymentData = {
                    deploymentName: formData.get('deploymentName'),
                    sourceOrg: formData.get('sourceOrg'), // Ensure this matches the name in your HTML form
                    targetOrg: formData.get('targetOrg')  // Ensure this matches the name in your HTML form
                };
        
                fetch('/api/deployments/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(deploymentData),
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Deployment created:', data);
                    alert('Deployment created successfully!');
                    fetchDeployments(); // Refresh the deployments list
                    this.reset(); // Reset the form
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to create deployment. Please try again.');
                });
            });
       

            // Fetch and display existing deployments
            function fetchDeployments() {
                fetch('/api/deployments')
                    .then(response => response.json())
                    .then(deployments => {
                        const deploymentsList = document.getElementById('deploymentsList');
                        deploymentsList.innerHTML = '';
                        deployments.forEach(deployment => {
                            const deploymentElement = document.createElement('div');
                            deploymentElement.className = 'deployment-item';
                            deploymentElement.textContent = `${deployment.dep_name} (Source: ${deployment.source_org_name}, Target: ${deployment.target_org_name})`;
                            deploymentsList.appendChild(deploymentElement);
                        });
                    });
            }

            // Initial fetch of deployments
            fetchDeployments();
        });
    </script>
</body>
</html>
