<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve Metadata</title>
</head>
<body>
    <h1>Retrieve Metadata</h1>
    <form id="retrieve-form">
        <label for="componentType">Select Component Type:</label>
        <select id="componentType" name="componentType">
            <option value="ApexClass">Apex Class</option>
            <option value="ApexTrigger">Apex Trigger</option>
            <option value="CustomObject">Custom Object</option>
            <!-- Add other metadata types as needed -->
        </select>
        <button type="submit">Retrieve</button>
    </form>

    <div id="metadata-list"></div>

    <script>
        document.getElementById('retrieve-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const componentType = document.getElementById('componentType').value;
            const response = await fetch('/retrieve-all-components', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    accessToken: sessionStorage.getItem('accessToken'),
                    instanceUrl: sessionStorage.getItem('instanceUrl'),
                    componentType: componentType
                })
            });

            if (response.ok) {
                const metadata = await response.json();
                const metadataListDiv = document.getElementById('metadata-list');
                metadataListDiv.innerHTML = '';
                metadata.forEach(component => {
                    const div = document.createElement('div');
                    div.textContent = component.Name;
                    metadataListDiv.appendChild(div);
                });
            } else {
                alert('Failed to retrieve metadata');
            }
        });
    </script>
</body>
</html>
