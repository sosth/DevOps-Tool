<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Classes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .dropdown {
            margin-bottom: 20px;
        }
        .details {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .token {
            margin-top: 20px;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .retrieve-button {
            display: block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .retrieve-button:hover {
            background-color: #45a049;
        }
        #retrieve-result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Apex Classes</h1>
        <div class="dropdown">
            <label for="apexClasses">Select an Apex Class:</label>
            <select id="apexClasses" onchange="showDetails()">
                <option value="">--Select a Class--</option>
            </select>
        </div>
        <div class="details" id="classDetails" style="display: none;">
            <h2>Class Details</h2>
            <p><strong>Class Name:</strong> <span id="className"></span></p>
            <button class="retrieve-button" onclick="retrieveApexClass()">Retrieve</button>
        </div>
        <div class="token" id="tokenDetails" style="display: none;">
            <h2>Access Token</h2>
            <p><strong>Token:</strong> <span id="accessToken"></span></p>
        </div>
        <div id="retrieve-result"></div>
    </div>
    <script>
        // Fetch the Apex classes and populate the dropdown
        fetch('/apex-classes-data')
            .then(response => response.json())
            .then(data => {
                const dropdown = document.getElementById('apexClasses');
                data.forEach(className => {
                    const option = document.createElement('option');
                    option.value = className;
                    option.textContent = className;
                    dropdown.appendChild(option);
                });
            });

        function showDetails() {
            const dropdown = document.getElementById('apexClasses');
            const selectedClass = dropdown.value;
            const detailsDiv = document.getElementById('classDetails');
            if (selectedClass) {
                document.getElementById('className').textContent = selectedClass;
                detailsDiv.style.display = 'block';
            } else {
                detailsDiv.style.display = 'none';
            }
        }

        async function retrieveApexClass() {
            const className = document.getElementById('className').textContent;
            if (className) {
                const response = await fetch('/retrieve-apex-class', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ className })
                });
                const resultDiv = document.getElementById('retrieve-result');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.textContent = `Apex class file retrieved and saved to: ${data.filePath}`;
                } else {
                    resultDiv.textContent = 'Failed to retrieve Apex class file';
                }
            }
        }
    </script>
</body>
</html>
