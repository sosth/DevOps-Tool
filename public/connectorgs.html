<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Orgs</title>
    <style>
        .org-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
        .org-item strong {
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Connected Orgs</h1>
    <div id="org-list"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/connected-orgs');
                const orgs = await response.json();
                
                if (orgs.error) {
                    console.error(orgs.error);
                } else {
                    const orgList = document.getElementById('org-list');
                    orgList.innerHTML = '';  // Clear the list before adding new items

                    orgs.forEach(org => {
                        const orgItem = document.createElement('div');
                        orgItem.className = 'org-item';
                        orgItem.innerHTML = `
                            <strong>ID:</strong> ${org.id}
                            <strong>Name:</strong> ${org.name}
                            <strong>Instance Name:</strong> ${org.instance_name}
                            <strong>Organization Type:</strong> ${org.organization_type}
                            <strong>Is Sandbox:</strong> ${org.is_sandbox}
                            <strong>Created Date:</strong> ${new Date(org.created_date).toLocaleString()}
                            <strong>Primary Contact:</strong> ${org.primary_contact}
                            <strong>Country:</strong> ${org.country}
                            <strong>Default Locale:</strong> ${org.default_locale}
                            <strong>Time Zone:</strong> ${org.time_zone}
                            <strong>Language:</strong> ${org.language}
                            <strong>Access Token:</strong> ${org.access_token}
                        `;
                        orgList.appendChild(orgItem);
                    });
                }
            } catch (error) {
                console.error('Error fetching connected orgs:', error);
            }
        });
    </script>
</body>
</html>
