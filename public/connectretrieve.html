<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to Salesforce Org</title>
</head>
<body>
    <h1>Connect to Salesforce Org</h1>
    <a id="auth-link" href="#">Authenticate with Salesforce</a>
    <h2>Connected Orgs</h2>
    <ul id="org-list"></ul>
    <h2>Salesforce Org Info</h2>
    <div id="org-info"></div>

    <h2>Retrieve Apex Classes</h2>
    <select id="apex-class-dropdown">
        <option value="">Select Apex Class</option>
    </select>
    <button id="download-button">Download Selected</button>
    <button id="download-all-button">Download All</button>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const response = await fetch('/org-info-data');
            const data = await response.json();
            
            if (data.error) {
                console.error(data.error);
            } else {
                const orgList = document.getElementById('org-list');
                const listItem = document.createElement('li');
                listItem.textContent = `Access Token: ${data.accessToken}, Instance URL: ${data.instanceUrl}`;
                orgList.appendChild(listItem);

                // Fetch Apex classes
                const apexResponse = await fetch('/get-apex-classes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        accessToken: data.accessToken,
                        instanceUrl: data.instanceUrl,
                    }),
                });
                const apexClasses = await apexResponse.json();
                if (apexClasses.error) {
                    console.error(apexClasses.error);
                } else {
                    const dropdown = document.getElementById('apex-class-dropdown');
                    apexClasses.forEach(apexClass => {
                        const option = document.createElement('option');
                        option.value = apexClass.fullName;
                        option.textContent = apexClass.fullName;
                        dropdown.appendChild(option);
                    });
                }
            }

            const responseAuth = await fetch('/auth-url');
            const authData = await responseAuth.json();
            document.getElementById('auth-link').href = authData.url;

            const orgInfoResponse = await fetch('/get-org-info');
            const orgInfo = await orgInfoResponse.json();
            if (orgInfo.error) {
                console.error(orgInfo.error);
            } else {
                const orgInfoDiv = document.getElementById('org-info');
                orgInfoDiv.innerHTML = `
                    <p>Salesforce URL: ${orgInfo.attributes.url}</p>
                    <p>Org ID: ${orgInfo.Id}</p>
                    <p>Name: ${orgInfo.Name}</p>
                    <p>Instance Name: ${orgInfo.InstanceName}</p>
                    <p>Organization Type: ${orgInfo.OrganizationType}</p>
                    <p>Is Sandbox: ${orgInfo.IsSandbox}</p>
                    <p>Created Date: ${new Date(orgInfo.CreatedDate).toLocaleString()}</p>
                    <p>Primary Contact: ${orgInfo.PrimaryContact}</p>
                    <p>Country: ${orgInfo.Country}</p>
                    <p>Default Locale: ${orgInfo.DefaultLocaleSidKey}</p>
                    <p>Time Zone: ${orgInfo.TimeZoneSidKey}</p>
                    <p>Language: ${orgInfo.LanguageLocaleKey}</p>
                `;
            }

            document.getElementById('download-button').addEventListener('click', async () => {
                const selectedClass = document.getElementById('apex-class-dropdown').value;
                if (selectedClass) {
                    const downloadResponse = await fetch('/downloadselectedmetadata', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            accessToken: data.accessToken,
                            instanceUrl: data.instanceUrl,
                            fullName: selectedClass,
                        }),
                    });
                    const downloadData = await downloadResponse.json();
                    if (downloadData.error) {
                        console.error(downloadData.error);
                    } else {
                        window.location.href = `/public/retrieved_metadata/${downloadData.fileName}`;
                    }
                } else {
                    alert('Please select an Apex class to download.');
                }
            });

            document.getElementById('download-all-button').addEventListener('click', async () => {
                const downloadAllResponse = await fetch('/downloadallmetadata', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        accessToken: data.accessToken,
                        instanceUrl: data.instanceUrl,
                    }),
                });
                const downloadAllData = await downloadAllResponse.json();
                if (downloadAllData.error) {
                    console.error(downloadAllData.error);
                } else {
                    alert('All metadata files downloaded');
                }
            });
        });
    </script>
</body>
</html>
