<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Orgs</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>List of Orgs</h1>
    <table id="orgs-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Instance Name</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Orgs will be populated here -->
        </tbody>
    </table>

    <script>
        async function fetchOrgs() {
            try {
                const response = await fetch('/listorg');
                const orgs = await response.json();
                const tableBody = document.querySelector('#orgs-table tbody');
                tableBody.innerHTML = ''; // Clear any existing rows

                orgs.forEach(org => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${org.id}</td>
                        <td>${org.name}</td>
                        <td>${org.instance_name}</td>
                        <td><button onclick="deleteOrg('${org.id}')">Delete</button></td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching orgs:', error);
            }
        }

        async function deleteOrg(orgId) {
            try {
                const response = await fetch('/deleteorg', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ orgId })
                });
                if (response.ok) {
                    fetchOrgs(); // Refresh the org list after deletion
                } else {
                    console.error('Error deleting org');
                }
            } catch (error) {
                console.error('Error deleting org:', error);
            }
        }

        // Fetch orgs when the page loads
        document.addEventListener('DOMContentLoaded', fetchOrgs);
    </script>
</body>
</html>
