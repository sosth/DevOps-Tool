<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Deployment</title>
    <link rel="stylesheet" href="/styles.css"> <!-- Add styles if needed -->
</head>
<body>
    <h1>Create Deployment</h1>
    <form id="deploymentForm">
        <div>
            <label for="org_id">Organization ID:</label>
            <input type="number" id="org_id" name="org_id" required>
        </div>
        <div>
            <label for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" required>
        </div>
        <div>
            <label for="dep_name">Deployment Name:</label>
            <input type="text" id="dep_name" name="dep_name" required>
        </div>
        <div>
            <label for="dep_description">Deployment Description:</label>
            <textarea id="dep_description" name="dep_description" required></textarea>
        </div>
        <button type="submit">Create Deployment</button>
    </form>

    <script>
        document.getElementById('deploymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                org_id: document.getElementById('org_id').value,
                user_id: document.getElementById('user_id').value,
                dep_name: document.getElementById('dep_name').value,
                dep_description: document.getElementById('dep_description').value
            };

            try {
                const response = await fetch('/api/deployments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('Deployment created successfully');
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        });
    </script>
</body>
</html>
