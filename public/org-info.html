<!DOCTYPE html>
<html>
<head>
    <title>Org Info</title>
</head>
<body>
    <h1>Organization Info</h1>
    <div id="org-info"></div>

    <script>
        async function fetchOrgInfo() {
            const response = await fetch('/org-info-data');
            if (response.ok) {
                const data = await response.json();
                document.getElementById('org-info').innerHTML = `
                    <p>Access Token: ${data.accessToken}</p>
                    <p>Instance URL: ${data.instanceUrl}</p>
                    <p>Authorized Orgs Count: ${data.authorizedOrgCount}</p>
                `;
            } else {
                document.getElementById('org-info').textContent = 'Failed to fetch org info';
            }
        }

        fetchOrgInfo();
    </script>
</body>
</html>
