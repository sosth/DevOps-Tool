<!DOCTYPE html>
<html>
<head>
    <title>List Organizations</title>
</head>
<body>
    <h1>Organizations</h1>
    <ul id="orgList"></ul>

    <script>
        fetch('/connected-orgs')
            .then(response => response.json())
            .then(orgs => {
                const list = document.getElementById('orgList');
                orgs.forEach(org => {
                    const li = document.createElement('li');
                    li.textContent = `${org.name} (${org.id})`;
                    list.appendChild(li);
                });
            });
    </script>
</body>
</html>
