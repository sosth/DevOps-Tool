<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve Apex Classes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group button {
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Retrieve Apex Classes</h2>
        <form id="retrieveApexForm">
            <div class="form-group">
                <label for="orgName">Org Name</label>
                <input type="text" id="orgName" name="orgName" required>
            </div>
            <div class="form-group">
                <button type="submit">Retrieve</button>
            </div>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('retrieveApexForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const orgName = document.getElementById('orgName').value;

            try {
                const response = await fetch('/api/apex/retrieve-apex-classes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ orgName })
                });

                const result = await response.json();
                const resultDiv = document.getElementById('result');

                if (response.ok) {
                    resultDiv.textContent = result.message;
                } else {
                    resultDiv.textContent = `Error: ${result.error}`;
                }
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
